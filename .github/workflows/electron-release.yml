name: Electron desktop release

on:
  push:
    tags:
      - 'electron-v*'

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag version
        run: |
          version=$(node -p 'require("./apps/electron/app/package.json").version')
          test "$GITHUB_REF_NAME" = "electron-v$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web runtime
        run: pnpm run build

      - name: Package unsigned DMG
        run: node apps/electron/scripts/package-mac.mjs ${{ matrix.arch }}

      - name: Verify window close and reopen
        run: node apps/electron/tests/window-lifecycle.mjs

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/electron/dist/release/*.dmg
            apps/electron/dist/release/*.zip

  package-fedora:
    name: Package Fedora ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag version
        run: |
          version=$(node -p 'require("./apps/electron/app/package.json").version')
          test "$GITHUB_REF_NAME" = "electron-v$version"

      - name: Install RPM build dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web runtime
        run: pnpm run build

      - name: Package Fedora RPM
        run: node apps/electron/scripts/package-linux.mjs ${{ matrix.arch }}

      - name: Verify Linux window close and reopen
        run: |
          sudo apt-get install --no-install-recommends -y xvfb
          xvfb-run --auto-servernum node apps/electron/tests/window-lifecycle.mjs

      - name: Verify RPM on Fedora 44
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          --workdir /workspace
          fedora:44
          bash apps/electron/scripts/smoke-fedora-rpm.sh apps/electron/dist/release

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: electron-fedora-${{ matrix.arch }}
          if-no-files-found: error
          path: apps/electron/dist/release/*.rpm

  release:
    name: Publish GitHub release
    needs: [package-macos, package-fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: apps/electron/dist/release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # Publishing remains a deliberate maintainer action: validate every
          # architecture-specific installer before exposing it to users.
          draft: true
          generate_release_notes: true
          files: |
            apps/electron/dist/release/*.dmg
            apps/electron/dist/release/*.rpm
            apps/electron/dist/release/*.zip
