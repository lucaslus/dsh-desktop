name: Electron desktop release

on:
  push:
    tags:
      - 'electron-v*'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: macOS arm64
            platform: darwin
            runner: macos-14
            assets: |
              apps/electron/dist/release/*.dmg
              apps/electron/dist/release/*.zip
          - arch: x64
            label: macOS x64
            platform: darwin
            runner: macos-15-intel
            assets: |
              apps/electron/dist/release/*.dmg
              apps/electron/dist/release/*.zip
          - arch: x64
            label: Fedora Linux x86_64
            platform: linux
            runner: ubuntu-24.04
            assets: apps/electron/dist/release/*.rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag version
        run: |
          version=$(node -p 'require("./apps/electron/app/package.json").version')
          test "$GITHUB_REF_NAME" = "electron-v$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install RPM packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build web runtime
        run: pnpm run build

      - name: Package desktop application
        run: node apps/electron/scripts/package.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ matrix.assets }}

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: apps/electron/dist/release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # Publishing remains a deliberate maintainer action: validate the
          # two architecture-specific DMGs and the RPM before exposing them.
          draft: true
          generate_release_notes: true
          files: |
            apps/electron/dist/release/*.dmg
            apps/electron/dist/release/*.zip
            apps/electron/dist/release/*.rpm
