appId: com.deepseek-ai.dsh-desktop
productName: DeepSeek Harness
artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
directories:
  # Build from the small shell-only workspace.  The separate parent workspace
  # is used solely to stage Harness in Contents/Resources, so the dependency
  # graph is copied exactly once.
  app: app
  output: dist/release
files:
  - main.mjs
  - platform.mjs
  - splash.html
  - package.json
  # Harness is staged separately in Contents/Resources by afterPack. Do not
  # let electron-builder discover the parent workspace's development tree and
  # put a second copy into app.asar.
  - '!node_modules/**'
afterPack: scripts/copy-harness-runtime.mjs
mac:
  category: public.app-category.developer-tools
  icon: ../desktop/Resources/icon.icns
  # This project distributes unsigned DMGs. Apple Developer signing and
  # notarization are intentionally out of scope, so users install updates
  # manually from GitHub Releases.
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
    - target: zip
dmg:
  title: DeepSeek Harness
linux:
  category: Development
  description: A self-contained desktop application for DeepSeek Harness
  executableName: dsh-desktop
  icon: ../desktop/Resources/icon.icns
  maintainer: DeepSeek Harness Desktop contributors
  synopsis: DeepSeek Harness desktop application
  syncDesktopName: true
  target:
    - target: rpm
  vendor: DeepSeek Harness Desktop contributors
rpm:
  depends:
    - alsa-lib
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - mesa-libgbm
  packageName: deepseek-harness-desktop
